openapi: 3.1.0
info:
  title: SeenFlix API
  version: 0.1.0
  description: Contrat initial de l'API SeenFlix.
servers:
  - url: http://localhost:3000/api
paths:
  /health:
    get:
      summary: Vérifie que l'API fonctionne
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: seenflix-api
